<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Листовки акции — Глаз Да Глаз</title>
<style>
  @page { size: A4; margin: 8mm; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    color: #000;
    background: #fff;
  }
  .toolbar {
    max-width: 210mm;
    margin: 12px auto;
    padding: 0 12px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }
  .toolbar button {
    border: 2px solid #000;
    background: #fff;
    padding: 10px 16px;
    font-weight: 800;
    cursor: pointer;
    font-size: 14px;
  }
  .toolbar p { margin: 0; font-size: 13px; line-height: 1.4; }
  .sheet {
    width: 210mm;
    min-height: 297mm;
    margin: 0 auto;
    padding: 8mm;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr 1fr;
    gap: 4mm;
  }
  .flyer {
    border: 2.5px solid #000;
    padding: 4.5mm 5mm;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    page-break-inside: avoid;
  }
  .brand {
    text-align: center;
    border-bottom: 2px solid #000;
    padding-bottom: 2.5mm;
    margin-bottom: 2.5mm;
  }
  .brand .name {
    font-size: 18px;
    font-weight: 900;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    line-height: 1.1;
  }
  .brand .tag {
    margin-top: 1.5mm;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .badge {
    margin: 0 auto 2.5mm;
    border: 2px solid #000;
    display: inline-block;
    padding: 1.2mm 3mm;
    font-size: 11px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .headline {
    text-align: center;
    font-size: 15px;
    font-weight: 900;
    line-height: 1.2;
    margin: 0 0 2.5mm;
  }
  .offer {
    font-size: 11px;
    line-height: 1.35;
    margin: 0 0 2mm;
    text-align: center;
  }
  .rules {
    margin: 0;
    padding: 0;
    list-style: none;
    font-size: 10.5px;
    line-height: 1.35;
  }
  .rules li {
    margin: 0 0 1.6mm;
    padding-left: 3.2mm;
    position: relative;
  }
  .rules li::before {
    content: "•";
    position: absolute;
    left: 0;
    top: 0;
    font-weight: 900;
  }
  .note {
    margin-top: 2mm;
    border-top: 1.5px solid #000;
    border-bottom: 1.5px solid #000;
    padding: 2mm 0;
    font-size: 10.5px;
    font-weight: 700;
    line-height: 1.3;
    text-align: center;
  }
  .contacts {
    margin-top: 2.5mm;
    text-align: center;
    font-size: 11px;
    line-height: 1.35;
  }
  .contacts .salon {
    font-weight: 900;
    font-size: 12px;
  }
  .contacts .phone {
    font-weight: 900;
    font-size: 13px;
    margin-top: 0.8mm;
  }
  @media print {
    .toolbar { display: none !important; }
    body { background: #fff; }
    .sheet {
      width: auto;
      min-height: auto;
      margin: 0;
      padding: 0;
    }
  }
</style>
</head>
<body>
  <div class="toolbar">
    <button type="button" onclick="window.print()">Печать (6 листовок на A4)</button>
    <p>Чёрно-белый макет. На одном листе A4 — 6 одинаковых листовок. Разрежьте по линиям рамки.</p>
  </div>

  <div class="sheet" id="sheet"></div>

<script>
const SALON = {
  name: 'Глаз Да Глаз',
  address: 'Косухина 37а',
  phone: '8 919 270-61-64'
};

const flyerHTML = `
  <article class="flyer">
    <div>
      <div class="brand">
        <div class="name">${SALON.name}</div>
        <div class="tag">Оптический салон</div>
      </div>
      <div style="text-align:center"><span class="badge">Акция</span></div>
      <h2 class="headline">Солнцезащитные линзы<br>в подарок</h2>
      <p class="offer">Закажите очки для зрения — оправу и линзы — и получите пару солнцезащитных линз бесплатно.</p>
      <ul class="rules">
        <li>Подарок: солнцезащитные линзы к заказу очков для зрения</li>
        <li>Линзы можно поставить в другую оправу</li>
        <li>Бесплатная установка — при покупке оправы в нашем салоне</li>
      </ul>
      <div class="note">Купили оправу + линзы для зрения → солнцезащитные линзы в подарок</div>
    </div>
    <div class="contacts">
      <div class="salon">${SALON.name}</div>
      <div>${SALON.address}</div>
      <div class="phone">${SALON.phone}</div>
    </div>
  </article>
`;

document.getElementById('sheet').innerHTML = flyerHTML.repeat(6);
</script>
</body>
</html>
