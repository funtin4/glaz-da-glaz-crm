<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Превью листовки</title>
<style>
@page{size:A4;margin:18mm}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#fff;color:#000;-webkit-print-color-adjust:exact;print-color-adjust:exact;display:flex;align-items:center;justify-content:center;min-height:100vh}
.flyer{width:105mm;height:148mm;border:2px solid #000;display:flex;flex-direction:column;overflow:hidden}
.inner{flex:1;padding:8mm 7mm 5mm;display:flex;flex-direction:column;align-items:center;text-align:center;justify-content:space-between}
.logo{display:inline-flex;align-items:center;gap:3mm;margin-bottom:5mm}
.logo svg{width:12mm;height:12mm}
.logo span{font-size:20px;font-weight:800}
.headline{font-size:26px;font-weight:900;line-height:1.05;text-transform:uppercase;margin-bottom:4mm}
.lead{font-size:13px;line-height:1.3;max-width:88mm;margin:0 auto 4mm}
.glasses{width:88mm;height:36mm;margin:2mm auto}
.glasses svg{width:100%;height:100%}
.benefits{width:100%;display:grid;grid-template-columns:1fr 1fr 1fr;gap:3mm;padding-top:4mm;border-top:1.5px solid #000}
.benefit{display:flex;flex-direction:column;align-items:center;gap:2mm}
.icon{width:12mm;height:12mm;border:1.6px solid #000;border-radius:50%;display:flex;align-items:center;justify-content:center}
.icon svg{width:6.5mm;height:6.5mm}
.benefit p{font-size:11px;line-height:1.15;font-weight:700}
.footer{background:#000;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:4mm 5mm;font-size:13px;font-weight:700}
.footer .item{display:flex;align-items:center;gap:2mm}
.footer svg{width:4.5mm;height:4.5mm}
</style></head><body>
<article class="flyer">
  <div class="inner">
    <div class="top">
      <div class="logo">
        <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18.5" fill="none" stroke="#000" stroke-width="2.2"/><ellipse cx="20" cy="20" rx="12" ry="7.5" fill="none" stroke="#000" stroke-width="2"/><circle cx="20" cy="20" r="4.2" fill="#000"/><circle cx="21.4" cy="18.6" r="1.2" fill="#fff"/></svg>
        <span>Глаз да глаз</span>
      </div>
      <h1 class="headline">Солнцезащитные<br>линзы в подарок</h1>
      <p class="lead">Закажите очки для зрения — и получите пару солнцезащитных линз для вторых очков бесплатно.</p>
      <div class="glasses">
        <svg viewBox="0 0 320 120" aria-hidden="true">
          <defs>
            <linearGradient id="tintSingle" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#2a2a2a"/>
              <stop offset="55%" stop-color="#111"/>
              <stop offset="100%" stop-color="#000"/>
            </linearGradient>
          </defs>
          <path d="M138 52c10-12 34-12 44 0" fill="none" stroke="#000" stroke-width="6" stroke-linecap="round"/>
          <path d="M34 54 L6 46" fill="none" stroke="#000" stroke-width="6" stroke-linecap="round"/>
          <path d="M286 54 L314 46" fill="none" stroke="#000" stroke-width="6" stroke-linecap="round"/>
          <rect x="34" y="30" width="104" height="66" rx="22" fill="#fff" stroke="#000" stroke-width="6"/>
          <path d="M58 52c12-10 46-10 58 0" fill="none" stroke="#000" stroke-width="1.8" opacity=".22"/>
          <path d="M62 72c18 8 46 8 64 0" fill="none" stroke="#000" stroke-width="1.4" opacity=".12"/>
          <rect x="182" y="30" width="104" height="66" rx="22" fill="url(#tintSingle)" stroke="#000" stroke-width="6"/>
          <path d="M206 52c12-10 46-10 58 0" fill="none" stroke="#fff" stroke-width="2" opacity=".28"/>
          <circle cx="242" cy="58" r="4" fill="#fff" opacity=".18"/>
        </svg>
      </div>
    </div>
    <div class="benefits">
      <div class="benefit"><div class="icon"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5" fill="none" stroke="#000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10.5V20h12v-9.5" fill="none" stroke="#000" stroke-width="2.2" stroke-linejoin="round"/><path d="M10 20v-5h4v5" fill="none" stroke="#000" stroke-width="2.2" stroke-linejoin="round"/></svg></div><p>Одни очки<br>для помещения</p></div>
      <div class="benefit"><div class="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2" fill="none" stroke="#000" stroke-width="2.2"/><path d="M12 2.8v2.6M12 18.6v2.6M2.8 12h2.6M18.6 12h2.6M5.4 5.4l1.8 1.8M16.8 16.8l1.8 1.8M18.6 5.4l-1.8 1.8M7.2 16.8l-1.8 1.8" stroke="#000" stroke-width="2.2" stroke-linecap="round"/></svg></div><p>Вторые для<br>яркого солнца</p></div>
      <div class="benefit"><div class="icon"><svg viewBox="0 0 24 24"><path d="M2.5 12s3.8-6.2 9.5-6.2S21.5 12 21.5 12 17.7 18.2 12 18.2 2.5 12 2.5 12Z" fill="none" stroke="#000" stroke-width="2.1"/><circle cx="12" cy="12" r="2.8" fill="#000"/></svg></div><p>Бесплатная<br>проверка зрения</p></div>
    </div>
  </div>
  <div class="footer">
    <div class="item"><svg viewBox="0 0 24 24"><path fill="#fff" d="M12 22s7-7.2 7-12.2A7 7 0 0 0 5 9.8C5 14.8 12 22 12 22Z"/><circle cx="12" cy="9.8" r="2.4" fill="#000"/></svg><span>Косухина 37а</span></div>
    <div class="item"><svg viewBox="0 0 24 24"><path fill="#fff" d="M7.2 3.8h3.1l1.2 4.2-2 1.2a12.4 12.4 0 0 0 5.3 5.3l1.2-2 4.2 1.2v3.1c0 .8-.6 1.4-1.4 1.4A15.8 15.8 0 0 1 3.8 5.2c0-.8.6-1.4 1.4-1.4Z"/></svg><span>89192706164</span></div>
  </div>
</article></body></html>
